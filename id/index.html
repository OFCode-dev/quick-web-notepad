/* Set the theme before first paint to avoid a flash. */
(function(){var t;try{t=JSON.parse(localStorage.getItem('qwn:prefs')||'{}').theme}catch(e){}
if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
document.documentElement.dataset.theme=t})();
</script>

<header id="titlebar">
  <img src="/icon.svg" width="22" height="22" alt="">
  <h1 class="brand"><b>Quick</b> Web Notepad</h1>
  <span id="fileBox">
    <input id="fileName" type="text" value="Untitled" spellcheck="false" autocomplete="off" aria-label="Nama file" data-ka="fileName">
    <span class="dot" aria-hidden="true">.</span>
    <input id="fileExt" type="text" placeholder="txt" list="extList" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Ekstensi file" data-ka="fileExt">
    <datalist id="extList"><option value="txt"><option value="md"><option value="html"><option value="css"><option value="js"><option value="json"><option value="py"><option value="sql"><option value="sh"><option value="c"><option value="csv"><option value="log"><option value="xml"><option value="yaml"></datalist>
  </span>
  <select id="langSelect" aria-label="Bahasa" data-ka="language">
    <option value="en" lang="en">English</option>
    <option value="es" lang="es">Español</option>
    <option value="zh" lang="zh-Hans">中文</option>
    <option value="hi" lang="hi">हिन्दी</option>

    <option value="fr" lang="fr">Français</option>
    <option value="pt" lang="pt">Português</option>
    <option value="id" selected lang="id">Indonesia</option>
    <option value="vi" lang="vi">Tiếng Việt</option>

    <option value="ko" lang="ko">한국어</option>
    <option value="ru" lang="ru">Русский</option>
  </select>
</header>

<div id="toolbar" role="toolbar" aria-label="Bilah alat" data-ka="toolbar">
  <button id="bOpen"><svg class="ic"><use href="#i-open"/></svg><span class="lbl" data-k="file">Buka</span></button>
  <button id="bNewTab"><svg class="ic"><use href="#i-newtab"/></svg><span class="lbl" data-k="newTab">Tab baru</span></button>
  <button id="bRecent" popovertarget="recentMenu"><svg class="ic"><use href="#i-recent"/></svg><span class="lbl" data-k="recent">Terbaru</span></button>
  <button id="bSave"><svg class="ic"><use href="#i-save"/></svg><span class="lbl" data-k="save">Simpan</span></button>
  <span class="sep"></span>
  <button id="bPaste"><svg class="ic"><use href="#i-paste"/></svg><span class="lbl" data-k="paste">Tempel</span></button>
  <button id="bCopy"><svg class="ic"><use href="#i-copy"/></svg><span class="lbl" data-k="copy">Salin</span></button>
  <button id="bClear"><svg class="ic"><use href="#i-clear"/></svg><span class="lbl" data-k="clear">Bersihkan</span></button>
  <span class="sep"></span>
  <button id="bWrap" aria-pressed="false"><svg class="ic"><use href="#i-wrap"/></svg><span class="lbl" data-k="wrap">Bungkus kata</span></button>
  <button id="bFind" aria-pressed="false"><svg class="ic"><use href="#i-find"/></svg><span class="lbl" data-k="find">Cari</span></button>
  <span class="sep"></span>
  <button id="bSyntax" aria-pressed="false"><svg class="ic"><use href="#i-syntax"/></svg><span class="lbl" data-k="syntax">Sintaks</span></button>
  <button id="bMarkdown" aria-pressed="false"><svg class="ic"><use href="#i-markdown"/></svg><span class="lbl" data-k="markdown">Markdown</span></button>
  <button id="bLock" aria-pressed="false"><svg class="ic"><use href="#i-unlock"/></svg><span class="lbl" data-k="lock">Kunci</span></button>
  <span class="sep"></span>
  <button id="bZoomOut" class="txt" aria-label="Perkecil" data-ka="zoomOut">A−</button>
  <button id="bZoomReset" class="txt" aria-label="Atur ulang zoom" data-ka="zoomReset">100%</button>
  <button id="bZoomIn" class="txt" aria-label="Perbesar" data-ka="zoomIn">A+</button>
  <span class="sep"></span>
  <button id="bTheme"><svg class="ic"><use href="#i-sun"/></svg><span class="lbl" data-k="light">Terang</span></button>
</div>

<!-- Notes from closed tabs, kept on this device. -->
<div id="recentMenu" popover role="dialog" aria-labelledby="recentTitle">
  <div class="rm-head"><strong id="recentTitle" data-k="recent">Terbaru</strong></div>
  <ul id="recentList"></ul>
  <p id="recentEmpty" data-k="recentEmpty">Catatan dari tab yang ditutup muncul di sini.</p>
  <div class="rm-foot">
    <label><input type="checkbox" id="chkKeep" checked> <span data-k="keepNotes">Simpan catatan yang ditutup di perangkat ini</span></label>
    <button id="bDeleteAll" class="txt" data-k="deleteAll">Hapus semua</button>
  </div>
</div>

<div id="findBar" hidden>
  <input id="findInput" type="text" spellcheck="false" autocomplete="off" aria-label="Cari" data-ka="find">
  <button id="bFindPrev" class="icon-only" aria-label="Sebelumnya" data-ka="prev"><svg class="ic"><use href="#i-up"/></svg></button>
  <button id="bFindNext" class="icon-only" aria-label="Berikutnya" data-ka="next"><svg class="ic"><use href="#i-down"/></svg></button>
  <span id="findCount" role="status"></span>
  <input id="replaceInput" type="text" spellcheck="false" autocomplete="off" aria-label="Ganti" data-ka="replace">
  <button id="bReplace" class="txt" data-k="replace">Ganti</button>
  <button id="bReplaceAll" class="txt" data-k="all">Semua</button>
  <label><input type="checkbox" id="chkCase"> <span id="lblCase" data-k="caseS">Cocokkan huruf besar/kecil</span></label>
  <label><input type="checkbox" id="chkRegex"> <span id="lblRegex" data-k="regex">Regex</span></label>
  <button id="bFindClose" class="icon-only" aria-label="Tutup" data-ka="close"><svg class="ic"><use href="#i-close"/></svg></button>
</div>

<main id="workspace">
  <noscript><p id="noscript"><span data-ns>Quick Web Notepad memerlukan JavaScript. Ini adalah notepad gratis yang berjalan sepenuhnya di browser Anda: buka dan simpan file teks, cari dan ganti, serta pratinjau Markdown, tanpa akun dan tanpa mengunggah apa pun.</span> <a href="/about.html" data-k="about">Tentang</a></p></noscript>
  <textarea id="editor" aria-label="Editor" data-ka="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
  <pre id="highlight" tabindex="0" hidden></pre>
  <article id="preview" class="md" tabindex="0" hidden></article>
</main>

<footer id="statusbar">
  <div class="group">
    <span id="stPos">Brs 1/1 · Kol 1</span>
    <span id="stWords">0 kata</span>
    <span id="stChars">0 karakter</span>
    <span id="stZoom">100%</span>
    <span id="stSel" hidden></span>
  </div>
  <div class="group">
    <span id="stLock" hidden></span>
    <span id="stMode"></span>
    <a id="aboutLink" href="/about.html" data-k="about">Tentang</a>
    <span id="stVersion">v3.1</span>
  </div>
</footer>
