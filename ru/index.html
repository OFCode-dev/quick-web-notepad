<script>
/* Set the theme before first paint to avoid a flash. */
(function(){var t;try{t=JSON.parse(localStorage.getItem('qwn:prefs')||'{}').theme}catch(e){}
if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
document.documentElement.dataset.theme=t})();
</script>

  <span class="sep"></span>
  <button id="bPaste"><svg class="ic"><use href="#i-paste"/></svg><span class="lbl" data-k="paste">Вставить</span></button>
  <button id="bCopy"><svg class="ic"><use href="#i-copy"/></svg><span class="lbl" data-k="copy">Копировать</span></button>
  <button id="bClear"><svg class="ic"><use href="#i-clear"/></svg><span class="lbl" data-k="clear">Очистить</span></button>

  <button id="bWrap" aria-pressed="false"><svg class="ic"><use href="#i-wrap"/></svg><span class="lbl" data-k="wrap">Перенос</span></button>

  <span class="sep"></span>
  <button id="bTheme"><svg class="ic"><use href="#i-sun"/></svg><span class="lbl" data-k="light">Светлая</span></button>

<div id="findBar" hidden>
  <input id="findInput" type="text" spellcheck="false" autocomplete="off" aria-label="Найти" data-ka="find">
  <button id="bFindPrev" class="icon-only" aria-label="Предыдущее" data-ka="prev"><svg class="ic"><use href="#i-up"/></svg></button>
  <button id="bFindNext" class="icon-only" aria-label="Следующее" data-ka="next"><svg class="ic"><use href="#i-down"/></svg></button>
  <span id="findCount" role="status"></span>
  <input id="replaceInput" type="text" spellcheck="false" autocomplete="off" aria-label="Заменить" data-ka="replace">
  <button id="bReplace" class="txt" data-k="replace">Заменить</button>
  <button id="bReplaceAll" class="txt" data-k="all">Все</button>
  <label><input type="checkbox" id="chkCase"> <span id="lblCase" data-k="caseS">Учитывать регистр</span></label>
  <label><input type="checkbox" id="chkRegex"> <span id="lblRegex" data-k="regex">Regex</span></label>
  <button id="bFindClose" class="icon-only" aria-label="Закрыть" data-ka="close"><svg class="ic"><use href="#i-close"/></svg></button>
</div>

<main id="workspace">
  <noscript><p id="noscript"><span data-ns>Для Quick Web Notepad нужен JavaScript. Это бесплатный блокнот, который работает полностью в браузере: открывайте и сохраняйте текстовые файлы, ищите и заменяйте, просматривайте Markdown — без аккаунта и без загрузки данных на сервер.</span> <a href="/about.html" data-k="about">О программе</a></p></noscript>
  <textarea id="editor" aria-label="Редактор" data-ka="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
  <pre id="highlight" tabindex="0" hidden></pre>
  <article id="preview" class="md" tabindex="0" hidden></article>
</main>

    <span id="stPos">Стр 1/1 · Стлб 1</span>

  </div>
  <div class="group">
    <span id="stLock" hidden></span>
    <span id="stMode"></span>
    <a id="aboutLink" href="/about.html" data-k="about">О программе</a>
    <span id="stVersion">v3.0</span>
  </div>
</footer>

<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileInput" hidden>
